{% extends 'usuarios/templates/base.html' %}

{% block content %}
    <h1 class="mb-4">Eliminar Usuario</h1>
    <p>¿Estás seguro de que quieres eliminar a "{{ object.nombre_completo }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'lista_usuarios' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
